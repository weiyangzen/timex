services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timex
      POSTGRES_PASSWORD: timex
      POSTGRES_DB: timex
    ports:
      - "55432:5432"
    volumes:
      - timex_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

volumes:
  timex_postgres:
